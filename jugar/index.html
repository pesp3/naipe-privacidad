<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Naipe: Card Logic Puzzle</title>
<meta name="description" content="Un rompecabezas de lógica con cartas de póker, sin apuestas ni azar.">
<!--
  D-126: el enlace que lleva el texto de la partida del dia. Manda a la tienda del telefono de
  quien lo abre; en un ordenador, o si el navegador no se deja identificar, enseña las dos.
  6823471927 es el Apple ID de la app (App Store Connect → Informacion de la app).
-->
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.65;
    max-width: 42rem;
    margin: 0 auto;
    padding: 2.5rem 1.25rem 5rem;
    color: #1a1a1a;
    background: #fff;
    text-align: center;
  }
  @media (prefers-color-scheme: dark) {
    body { color: #e6e6e6; background: #16181a; }
    a { color: #7fb2e5; }
  }
  h1 { font-size: 1.7rem; line-height: 1.2; margin-bottom: 0.25rem; }
  .tiendas a {
    display: block;
    margin: 0.75rem auto;
    max-width: 20rem;
    padding: 0.9rem 1rem;
    border: 1px solid currentColor;
    border-radius: 0.6rem;
    text-decoration: none;
    font-weight: 600;
  }
</style>
</head>
<body>

<h1>Naipe: Card Logic Puzzle</h1>
<p>Un rompecabezas de lógica con cartas de póker, sin apuestas ni azar.<br>
   <span lang="en">A logic puzzle with poker cards. No betting, no luck.</span></p>

<div class="tiendas">
  <a id="ios" href="https://apps.apple.com/app/id6823471927">App Store (iPhone)</a>
  <a id="android" href="https://play.google.com/store/apps/details?id=com.pabloespinoza.naipe">Google Play (Android)</a>
</div>

<script>
  (function () {
    var ua = navigator.userAgent || "";
    // iPadOS se presenta como Mac; con pantalla tactil, es un iPad.
    var ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    var android = /Android/.test(ua);
    var destino = ios ? document.getElementById("ios").href
                : android ? document.getElementById("android").href : null;
    if (destino) location.replace(destino);
  })();
</script>

</body>
</html>
